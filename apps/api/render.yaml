services:
  - type: web
    name: loom-api
    env: node
    rootDir: apps/api
    buildCommand: npm install
    startCommand: node src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: OLLAMA_HOST
        value: http://127.0.0.1:11434
      - key: OLLAMA_MODEL
        value: llama3.2:1b
